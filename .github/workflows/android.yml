name: Android APK

# Triggered after configuring the permanent ORANGE-SHIELD release signing secrets.
# 2.3.0 adds secure in-app update checks from signed GitHub releases.

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ main, 'work/**' ]
    paths: [ 'android-app/**', '.github/workflows/android.yml' ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        run: |
          APP_VERSION="$(sed -n 's/.*versionName = "\\(.*\\)".*/\\1/p' android-app/app/build.gradle.kts | head -n 1)"
          test -n "$APP_VERSION"
          echo "APP_VERSION=$APP_VERSION" >> "$GITHUB_ENV"
          echo "Building ORANGE-SHIELD $APP_VERSION"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Prepare and require permanent release signing key
        env:
          STORE_BASE64: ${{ secrets.ORANGE_SIGNING_STORE_BASE64 }}
        run: |
          if [ -z "$STORE_BASE64" ]; then
            echo "::error::Permanent release signing key is missing. Refusing to publish an unsigned APK."
            exit 1
          fi
          echo "$STORE_BASE64" | base64 --decode > "$RUNNER_TEMP/orange-shield-upload.jks"
          test -s "$RUNNER_TEMP/orange-shield-upload.jks"
          chmod 600 "$RUNNER_TEMP/orange-shield-upload.jks"

      - name: Build debug and release packages
        working-directory: android-app
        env:
          ORANGE_SIGNING_STORE_FILE: ${{ runner.temp }}/orange-shield-upload.jks
          ORANGE_SIGNING_STORE_PASSWORD: ${{ secrets.ORANGE_SIGNING_STORE_PASSWORD }}
          ORANGE_SIGNING_KEY_ALIAS: ${{ secrets.ORANGE_SIGNING_KEY_ALIAS }}
          ORANGE_SIGNING_KEY_PASSWORD: ${{ secrets.ORANGE_SIGNING_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest assembleDebug assembleRelease bundleRelease --no-daemon --console=plain
          RELEASE_APK="$(find app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          test -n "$RELEASE_APK"
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --verbose --print-certs "$RELEASE_APK"

      - name: Stage Android packages
        run: |
          set -euo pipefail
          mkdir -p dist

          DEBUG_APK="$(find android-app/app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_APK="$(find android-app/app/build/outputs/apk/release -maxdepth 1 -type f -name '*.apk' -print -quit)"
          RELEASE_AAB="$(find android-app/app/build/outputs/bundle/release -maxdepth 1 -type f -name '*.aab' -print -quit)"

          test -n "$DEBUG_APK" && test -f "$DEBUG_APK"
          test -n "$RELEASE_APK" && test -f "$RELEASE_APK"
          test -n "$RELEASE_AAB" && test -f "$RELEASE_AAB"

          cp "$DEBUG_APK" dist/ORANGE-SHIELD-v${{ env.APP_VERSION }}-debug.apk
          if [[ "$(basename "$RELEASE_APK")" == *-unsigned.apk ]]; then
            cp "$RELEASE_APK" dist/ORANGE-SHIELD-v${{ env.APP_VERSION }}-release-unsigned.apk
            echo "Release APK: unsigned (unexpected; build verification should have failed)." > dist/BUILD-NOTES.txt
          else
            cp "$RELEASE_APK" dist/ORANGE-SHIELD-v${{ env.APP_VERSION }}-release.apk
            echo "Release APK: signed by the configured release signing key." > dist/BUILD-NOTES.txt
          fi
          cp "$RELEASE_AAB" dist/ORANGE-SHIELD-v${{ env.APP_VERSION }}-release.aab

      - name: Generate package checksums
        run: |
          set -euo pipefail
          cd dist
          sha256sum *.apk *.aab > SHA256SUMS.txt

      - name: Upload Android test and release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: ORANGE-SHIELD-v${{ env.APP_VERSION }}-android
          path: dist/*
          if-no-files-found: error

      - name: Publish downloadable GitHub prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.APP_VERSION }}-build-${{ github.run_number }}
          name: ORANGE-SHIELD ${{ env.APP_VERSION }} — Build ${{ github.run_number }}
          target_commitish: ${{ github.sha }}
          prerelease: true
          generate_release_notes: true
          files: |
            dist/*.apk
            dist/*.aab
            dist/BUILD-NOTES.txt
            dist/SHA256SUMS.txt
