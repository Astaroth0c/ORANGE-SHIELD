# ORANGE SHIELD — propriedades do Gradle
org.gradle.jvmargs=-Xmx1536m -XX:MaxMetaspaceSize=512m -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx1024m
org.gradle.parallel=false
org.gradle.caching=true
# Tolerância a rate-limit (429/5xx) dos repositórios Maven em IPs compartilhados
org.gradle.internal.repository.max.retries=10
org.gradle.internal.repository.initial.backoff=1000
android.useAndroidX=true
kotlin.code.style=official
